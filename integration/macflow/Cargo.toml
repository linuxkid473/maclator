[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/platform", "crates/macflow"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-service-management = "0.3.2"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "unwind"

